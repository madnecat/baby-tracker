<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1030" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fdf6ff" media="(prefers-color-scheme: light)" />
    <title>Baby Tracker</title>
    <script>
      // Paint the saved theme before the app loads, so a dark choice never flashes white.
      try {
        var saved = localStorage.getItem('baby-tracker.theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
